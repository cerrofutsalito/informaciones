<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerro Porteño Futsal | Base y Formativas 2026</title>
  <meta name="description"
    content="Horarios de entrenamiento, sedes e inscripciones de Cerro Porteño Futsal Base y Formativas 2026.">
  <meta name="theme-color" content="#030712">

  <!-- Estilos Locales Optimizados (Zero CDN, Peso Mínimo) -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- Ambient background glow -->
  <div class="glow-backdrop" aria-hidden="true">
    <div class="glow-blue"></div>
    <div class="glow-red"></div>
  </div>

  <!-- Main Container -->
  <main class="app-container">

    <!-- ========================================== -->
    <!-- ENCABEZADO INSTITUCIONAL PERMANENTE        -->
    <!-- ========================================== -->
    <header id="app-header" class="app-header" title="Volver al inicio">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-circle">
          <picture>
            <source srcset="imagenes/logo.webp" type="image/webp">
            <img src="imagenes/logo.png" alt="Cerro Porteño Futsalito" width="256" height="256" fetchpriority="high">
          </picture>
        </div>
      </div>

      <div class="status-pill" title="Temporada 2026 activa">
        <span class="status-pulse-dot"></span>
        <span class="status-pill-text">Inscripciones Abiertas 2026</span>
      </div>

      <h1 class="app-title">
        Cerro Porteño <span class="red-text">Futsal</span>
      </h1>
      <p class="app-subtitle">
        Base y Formativas • Horarios 2026
      </p>
    </header>

    <!-- ========================================== -->
    <!-- CONTENEDOR DINÁMICO (VIEW TRANSITIONS API) -->
    <!-- ========================================== -->
    <div id="view-container">
      <!-- Generado dinámicamente por assets/js/app.js -->
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      Club Cerro Porteño © 2026 • Futsal Base y Formativas
    </footer>

  </main>

  <!-- ========================================== -->
  <!-- BARRA FIJA INFERIOR (STICKY DOCK)          -->
  <!-- ========================================== -->
  <aside class="sticky-dock">
    <div class="dock-content">

      <!-- Perfil Coordinación Tami Benitez -->
      <div class="profile-area">
        <div class="avatar-wrapper">
          <picture>
            <source srcset="imagenes/avatar-tami.webp" type="image/webp">
            <img src="imagenes/avatar-tami.png" alt="Tami Benitez" class="avatar-img" width="36" height="36"
              loading="lazy">
          </picture>
          <span class="online-dot" title="En línea"></span>
        </div>
        <div class="profile-texts">
          <span class="profile-name">Tami Benitez</span>
          <span class="profile-role">Coordinación</span>
        </div>
      </div>

      <!-- Indicador de disponibilidad en vista detalle (reemplaza botón duplicado) -->
      <div class="dock-availability" id="dock-availability" aria-hidden="true">
        <span class="dock-online-pill">
          <span class="dock-pulse-dot"></span>
          <span>Atención Inmediata</span>
        </span>
      </div>

      <!-- Botón WhatsApp Dinámico -->
      <a href="https://wa.me/595992355381" target="_blank" rel="noopener noreferrer" id="btn-whatsapp-tami"
        class="dock-btn">
        <picture>
          <source srcset="imagenes/whatsapp-icon.webp" type="image/webp">
          <img src="imagenes/whatsapp-icon.png" alt="WhatsApp" width="16" height="16">
        </picture>
        <span id="sticky-cta-text">Consultar WhatsApp</span>
      </a>

    </div>
  </aside>

  <!-- Lógica Nativa Ultra-ligera (Zero Dependencias Externas) -->
  <script src="assets/js/app.js" defer></script>
</body>

</html>
